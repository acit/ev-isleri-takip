name: 🚀 Release — Android APK + iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v3.3.0)'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # ANDROID BUILD
  # ============================================
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore from Secret
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > aile-takip-release.jks
          echo "Keystore decoded successfully"
          echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          RELEASE_STORE_FILE: aile-takip-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: aile-takip
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*= \([0-9]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "📱 Version: $VERSION (code: $CODE)"

      - name: Rename APK files
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Find release APK (may be app-release.apk or app-release-unsigned.apk)
          # İmza secret'ı (KEYSTORE_BASE64) yoksa app-release-unsigned.apk üretilir;
          # yine de release APK olarak yayınlanır (kullanıcı imzasız APK'yı da kurabilir).
          RELEASE_APK=$(find app/build/outputs/apk/release -name "app-release*.apk" | head -1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "AileTakip-v${VERSION}-release.apk"
            echo "Release APK: $RELEASE_APK"
          else
            echo "WARNING: No release APK found"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk \
             "AileTakip-v${VERSION}-debug.apk"
          ls -lh AileTakip-v${VERSION}-*.apk 2>/dev/null || echo "No APK files"
          echo "✅ APK files renamed"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: AileTakip-v${{ steps.version.outputs.version }}-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: AileTakip-v${{ steps.version.outputs.version }}-debug.apk
          retention-days: 30

      - name: Store APKs for release job
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            AileTakip-v${{ steps.version.outputs.version }}-release.apk
            AileTakip-v${{ steps.version.outputs.version }}-debug.apk
          retention-days: 1
          if-no-files-found: warn

  # ============================================
  # iOS BUILD
  # ============================================
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build for Device (Release) — No Code Sign
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Get iOS version
        id: ios_version
        run: |
          VERSION=$(grep 'MARKETING_VERSION' ios/AileTakip.xcodeproj/project.pbxproj | head -1 | sed 's/.*= \(.*\);.*/\1/' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 iOS Version: $VERSION"

      - name: Export IPA
        run: |
          cd ios
          VERSION=${{ steps.ios_version.outputs.version }}
          echo "=== Derleme ürün dizinleri ==="
          ls -la build/DerivedData/Build/Products/ 2>/dev/null || true
          echo "=== Tüm AileTakip.app kopyaları ==="
          find build/DerivedData -maxdepth 6 -name "AileTakip.app" -type d 2>/dev/null
          echo "=== Aday seçimi: binary içeren ilk .app (Release ürünü) ==="
          APP_PATH=""
          for candidate in $(find build/DerivedData -maxdepth 6 -name "AileTakip.app" -type d 2>/dev/null); do
            if [ -f "$candidate/AileTakip" ]; then
              case "$candidate" in
                *Release*) APP_PATH="$candidate"; break ;;
              esac
              if [ -z "$APP_PATH" ]; then APP_PATH="$candidate"; fi
            fi
          done
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Binary içeren AileTakip.app bulunamadı"
            find build/DerivedData -name "*.app" -type d 2>/dev/null | while read d; do echo "-- $d"; ls -la "$d" | head -8; done
            exit 1
          fi
          
          echo "Found app: $APP_PATH ($(du -sh "$APP_PATH" | cut -f1))"
          rm -rf build/IPA
          mkdir -p build/IPA/Payload
          cp -r "$APP_PATH" build/IPA/Payload/
          
          cd build/IPA
          zip -qry ../../AileTakip-v${VERSION}.ipa Payload/
          cd ../..
          
          echo "=== IPA Created ==="
          ls -lh AileTakip-v${VERSION}.ipa
          # Son kontrol: IPA en az 1 MB olmalı (boş zip tespiti)
          SIZE=$(stat -f%z AileTakip-v${VERSION}.ipa 2>/dev/null || stat -c%s AileTakip-v${VERSION}.ipa)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: IPA suspiciously small ($SIZE bytes)"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/AileTakip-v${{ steps.ios_version.outputs.version }}.ipa
          retention-days: 30

  # ============================================
  # CREATE GITHUB RELEASE
  # ============================================
  create-release:
    needs: [android-build, ios-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Android Release APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: .
        continue-on-error: true

      - name: Download Android Debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: .
        continue-on-error: true

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: .
        continue-on-error: true

      - name: List files
        run: ls -lh *.apk *.ipa 2>/dev/null || echo "Some files may be missing"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "📱 ${{ github.ref_name }} — Aile Takip"
          body: |
            ## 📱 Aile Takip ${{ github.ref_name }}
            
            Aile yönetim uygulamasının yeni sürümü!
            
            ### 📦 İndirme
            
            | Platform | Dosya | Boyut | Açıklama |
            |----------|-------|-------|----------|
            | 🤖 Android | `AileTakip-*-release.apk` | ~25 MB | ✅ İmzalı Release (önerilen) |
            | 🤖 Android | `AileTakip-*-debug.apk` | ~44 MB | Debug sürümü |
            | 🍎 iOS | `AileTakip-*.ipa` | ~20 MB | ⚠️ İmzasız (AltStore/TrollStore gerekli) |
            
            ### 🤖 Android Kurulum
            1. APK dosyasını indirin
            2. "Bilinmeyen kaynaklardan yükleme" iznini açın
            3. APK'ya tıklayıp yükleyin
            
            ### 🍎 iOS Kurulum
            1. [AltStore](https://altstore.io) veya [TrollStore](https://github.com/opa334/TrollStore) kurun
            2. IPA dosyasını uygulamaya sürükleyin
            3. Apple ID ile giriş yapın (AltStore) veya yükleyin (TrollStore)
            
            ### 📋 Yenilikler (3.7.4)
            - Mesajlar kronolojik sıralandı (yeni en altta)
            - WhatsApp ile aile daveti (Android + iOS)
            - iOS: Firebase senkronizasyonu (Android paritesi) + QR ile katılım
            - iOS: 30 sn canlı izleme (uzak değişiklikler otomatik gelir)
            - Haftalık market listesi + fiş OCR + akıllı alışveriş önerisi
            
            ---
            🤖 Otomatik olarak GitHub Actions ile oluşturuldu.
          files: |
            AileTakip-*.apk
            AileTakip-*.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # UPLOAD TO RELEASE (manual trigger)
  # ============================================
  upload-release-assets:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore from Secret
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > aile-takip-release.jks
          echo "Keystore decoded successfully"
          echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon
        env:
          RELEASE_STORE_FILE: aile-takip-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: aile-takip
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "AileTakip-v${{ steps.version.outputs.version }}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "AileTakip-v${{ steps.version.outputs.version }}-debug.apk"

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "📱 ${{ inputs.tag }} — Aile Takip"
          files: |
            AileTakip-v${{ steps.version.outputs.version }}-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
