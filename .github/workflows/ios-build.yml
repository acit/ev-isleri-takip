name: iOS Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Xcode & Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ hashFiles('ios/AileTakip.xcodeproj/project.pbxproj') }}
          restore-keys: ios-spm-

      - name: Find iOS Simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['name'])
                      exit()
          print('iPhone 16')
          ")
          echo "device=$DEVICE" >> $GITHUB_OUTPUT
          echo "Using simulator: $DEVICE"

      - name: Build for iOS Simulator (Debug)
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }},OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build | xcpretty

      - name: Run Unit Tests
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }},OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            test | xcpretty || true

      - name: Get iOS version
        id: ios_version
        run: |
          VERSION=$(grep 'MARKETING_VERSION' ios/AileTakip.xcodeproj/project.pbxproj | head -1 | sed 's/.*= \(.*\);.*/\1/' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "iOS Version: $VERSION"

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## iOS Installation
            
            This release requires building from source on macOS with Xcode 16+.
            
            ### Steps:
            1. Clone the repo: `git clone https://github.com/acit/ev-isleri-takip.git`
            2. Open `ios/AileTakip.xcodeproj` in Xcode
            3. Select your Apple account in Signing & Capabilities
            4. Build and run on your device
            
            ### Alternative (AltStore):
            1. Install [AltStore](https://altstore.io/) on your Mac
            2. Connect your iPhone
            3. Open the project in Xcode and build
            4. AltStore will handle signing
            
            ### Minimum Requirements:
            - iOS 18.0+
            - Xcode 16+
            - macOS 14+
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
