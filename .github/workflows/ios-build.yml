name: iOS Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Xcode & Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ hashFiles('ios/AileTakip.xcodeproj/project.pbxproj') }}
          restore-keys: ios-spm-

      - name: Find iOS Simulator
        id: simulator
        run: |
          # Find latest available iOS simulator
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['name'])
                      exit()
          print('iPhone 16')
          ")
          echo "device=$DEVICE" >> $GITHUB_OUTPUT
          echo "Using simulator: $DEVICE"

      - name: Build for iOS Simulator (Debug)
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }},OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build | xcpretty

      - name: Run Unit Tests
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }},OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            test | xcpretty || true

      - name: Get iOS version
        id: ios_version
        run: |
          VERSION=$(grep 'MARKETING_VERSION' ios/AileTakip.xcodeproj/project.pbxproj | head -1 | sed 's/.*= \(.*\);.*/\1/' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "iOS Version: $VERSION"

      - name: Find and Package .app
        run: |
          cd ios
          VERSION=${{ steps.ios_version.outputs.version }}
          FINAL_NAME="AileTakip-v${VERSION}.ipa"

          echo "=== Looking for AileTakip.app ==="

          # Search in all possible locations
          APP_PATH=""

          # 1. Standard DerivedData path
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData/Build/Products -name "AileTakip.app" -type d 2>/dev/null | head -1)
          fi

          # 2. Any .app in DerivedData
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "AileTakip.app" -type d 2>/dev/null | head -1)
          fi

          # 3. Any .app at all
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          fi

          # 4. Debug: show DerivedData structure
          if [ -z "$APP_PATH" ]; then
            echo "=== DerivedData structure ==="
            find build/DerivedData -maxdepth 5 -type d 2>/dev/null | head -40
            echo "=== Searching for any output ==="
            find build -name "*.app" -type d 2>/dev/null || echo "No .app anywhere"
            echo "=== Build Products ==="
            ls -la build/DerivedData/Build/Products/ 2>/dev/null || echo "No Products dir"
            exit 1
          fi

          echo "Found app: $APP_PATH"
          echo "App size: $(du -sh "$APP_PATH" | cut -f1)"

          # Create IPA structure
          mkdir -p build/IPA/Payload
          cp -r "$APP_PATH" build/IPA/Payload/

          # Create IPA (zip)
          cd build/IPA
          zip -r ../../$FINAL_NAME Payload/
          cd ../..

          echo "=== IPA Created ==="
          ls -lh $FINAL_NAME

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/AileTakip-v${{ steps.ios_version.outputs.version }}.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/AileTakip-v${{ steps.ios_version.outputs.version }}.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AileTakip-v*.ipa
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
