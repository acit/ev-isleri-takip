name: iOS Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Xcode & Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ hashFiles('ios/AileTakip.xcodeproj/project.pbxproj') }}
          restore-keys: ios-spm-

      - name: Build for iOS Simulator (Debug)
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build | xcpretty

      - name: Run Unit Tests
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            test | xcpretty || true

      - name: Get iOS version
        id: ios_version
        run: |
          VERSION=$(grep 'MARKETING_VERSION' ios/AileTakip.xcodeproj/project.pbxproj | head -1 | sed 's/.*= \(.*\);.*/\1/' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "iOS Version: $VERSION"

      - name: Build & Archive for IPA
        run: |
          cd ios
          echo "=== Archiving AileTakip ==="
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -archivePath build/AileTakip.xcarchive \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
          
          echo "=== Archive created ==="
          ls -la build/AileTakip.xcarchive/Products/ 2>/dev/null || echo "Products dir check"

      - name: Package IPA from Archive
        run: |
          cd ios
          VERSION=${{ steps.ios_version.outputs.version }}
          FINAL_NAME="AileTakip-v${VERSION}.ipa"
          
          echo "=== Archive structure ==="
          find build/AileTakip.xcarchive -maxdepth 5 -type d 2>/dev/null | head -30
          
          echo "=== Searching for AileTakip.app ==="
          APP_PATH=$(find build/AileTakip.xcarchive -name "AileTakip.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "WARN: AileTakip.app not found in archive"
            echo "Searching for any .app:"
            find build/AileTakip.xcarchive -name "*.app" -type d 2>/dev/null || echo "No .app found"
            
            echo "Trying Simulator build instead..."
            # Fall back to simulator build for IPA packaging
            SIM_APP=$(find build/DerivedData -name "AileTakip.app" -type d 2>/dev/null | head -1)
            if [ -z "$SIM_APP" ]; then
              echo "ERROR: No AileTakip.app found anywhere"
              echo "DerivedData structure:"
              find build/DerivedData -maxdepth 5 -name "*.app" -type d 2>/dev/null || echo "No .app in DerivedData"
              exit 1
            fi
            APP_PATH="$SIM_APP"
            echo "Using simulator app: $APP_PATH"
          fi
          
          echo "Found app: $APP_PATH"
          echo "App size: $(du -sh "$APP_PATH" | cut -f1)"
          
          # Create IPA structure
          mkdir -p build/IPA/Payload
          cp -r "$APP_PATH" build/IPA/Payload/
          
          # Create IPA (zip)
          cd build/IPA
          zip -r ../../$FINAL_NAME Payload/
          cd ../..
          
          echo "=== IPA Created ==="
          ls -lh $FINAL_NAME
          
          # Note: This IPA is unsigned. Users need AltStore/Sideloadly to install.
          echo "Note: This IPA may be unsigned. Use AltStore or Sideloadly to install on device."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/AileTakip-v${{ steps.ios_version.outputs.version }}.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/AileTakip-v${{ steps.ios_version.outputs.version }}.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AileTakip-v*.ipa
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
