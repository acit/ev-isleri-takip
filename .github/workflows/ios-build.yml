name: iOS Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Xcode & Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ hashFiles('ios/AileTakip.xcodeproj/project.pbxproj') }}
          restore-keys: ios-spm-

      - name: Build for iOS Simulator (Debug)
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build | xcpretty

      - name: Run Unit Tests
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            test | xcpretty || true

      - name: Build for Device (Release) — No Code Sign
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Get iOS version
        id: ios_version
        run: |
          VERSION=$(grep 'MARKETING_VERSION' ios/AileTakip.xcodeproj/project.pbxproj | head -1 | sed 's/.*= \(.*\);.*/\1/' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 iOS Version: $VERSION"

      - name: Export IPA
        run: |
          cd ios
          VERSION=${{ steps.ios_version.outputs.version }}
          echo "=== Finding AileTakip.app ==="
          APP_PATH=$(find build/DerivedData -name "AileTakip.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: AileTakip.app not found in build/DerivedData"
            echo "=== Listing .app directories ==="
            find build/DerivedData -name "*.app" -type d 2>/dev/null || echo "No .app found"
            echo "=== Listing build directory structure ==="
            find build -maxdepth 4 -type d 2>/dev/null || echo "No build dir"
            exit 1
          fi
          
          echo "Found app: $APP_PATH"
          
          # Create IPA structure
          mkdir -p build/IPA/Payload
          cp -r "$APP_PATH" build/IPA/Payload/
          
          # Create IPA (zip)
          cd build/IPA
          zip -r ../../AileTakip-v${VERSION}.ipa Payload/
          cd ../..
          
          echo "=== IPA Created ==="
          ls -lh AileTakip-v${VERSION}.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/AileTakip-v${{ steps.ios_version.outputs.version }}.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/AileTakip-v${{ steps.ios_version.outputs.version }}.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AileTakip-v*.ipa
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
