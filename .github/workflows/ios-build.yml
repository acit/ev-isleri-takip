name: iOS Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Xcode & Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ hashFiles('ios/AileTakip.xcodeproj/project.pbxproj') }}
          restore-keys: ios-spm-

      - name: Build for iOS Simulator (Debug)
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build | xcpretty

      - name: Run Unit Tests
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            test | xcpretty || true

      - name: Build for Device (Release) — No Code Sign
        run: |
          cd ios
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Get iOS version
        id: ios_version
        run: |
          VERSION=$(grep 'MARKETING_VERSION' ios/AileTakip.xcodeproj/project.pbxproj | head -1 | sed 's/.*= \(.*\);.*/\1/' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 iOS Version: $VERSION"

      - name: Archive for IPA
        run: |
          cd ios
          echo "=== Archiving AileTakip ==="
          xcodebuild \
            -project AileTakip.xcodeproj \
            -scheme AileTakip \
            -archivePath build/AileTakip.xcarchive \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Export IPA
        run: |
          cd ios
          VERSION=${{ steps.ios_version.outputs.version }}
          
          echo "=== Creating ExportOptions.plist ==="
          cat > build/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          PLIST
          
          echo "=== Exporting IPA ==="
          xcodebuild -exportArchive \
            -archivePath build/AileTakip.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            || echo "Export with manual signing failed, creating IPA manually..."
          
          # Fallback: manually create IPA from .app in archive
          IPA_FILE=$(find build/ipa -name "*.ipa" 2>/dev/null | head -1)
          
          if [ -z "$IPA_FILE" ]; then
            echo "=== Fallback: manual IPA from archive ==="
            APP_PATH=$(find build/AileTakip.xcarchive/Products -name "AileTakip.app" -type d 2>/dev/null | head -1)
            
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: AileTakip.app not found in archive"
              find build/AileTakip.xcarchive -name "*.app" -type d 2>/dev/null || echo "No .app found anywhere"
              exit 1
            fi
            
            echo "Found app: $APP_PATH"
            mkdir -p build/IPA/Payload
            cp -r "$APP_PATH" build/IPA/Payload/
            cd build/IPA
            zip -r ../../AileTakip-v${VERSION}.ipa Payload/
            cd ../..
            IPA_FILE="AileTakip-v${VERSION}.ipa"
          fi
          
          # Rename to correct version
          FINAL_NAME="AileTakip-v${VERSION}.ipa"
          if [ -f "$IPA_FILE" ] && [ "$(basename $IPA_FILE)" != "$FINAL_NAME" ]; then
            mv "$IPA_FILE" "$FINAL_NAME"
          fi
          
          echo "=== IPA Created ==="
          ls -lh $FINAL_NAME

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/AileTakip-v${{ steps.ios_version.outputs.version }}.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/AileTakip-v${{ steps.ios_version.outputs.version }}.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AileTakip-v*.ipa
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
